<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="6" y="6" width="948" height="400" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="480" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2328">How it works</text>
  <text x="480" y="72" text-anchor="middle" font-size="14.5" fill="#57606a">A browser and a PLC exchange one compact binary image over a single WebSocket.</text>

  <!-- BROWSER -->
  <rect x="70" y="104" width="330" height="196" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M70,146 V116 a12,12 0 0 1 12,-12 H388 a12,12 0 0 1 12,12 V146 Z" fill="#0969da"/>
  <text x="235" y="133" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">BROWSER</text>
  <text x="235" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Web UI + simulation</text>
  <text x="235" y="214" text-anchor="middle" font-size="12.5" fill="#57606a">JavaScript &#183; Canvas / SVG</text>
  <rect x="96" y="244" width="132" height="32" rx="16" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="162" y="265" text-anchor="middle" font-size="12.5" fill="#0550ae">Input dataset</text>
  <rect x="242" y="244" width="132" height="32" rx="16" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="308" y="265" text-anchor="middle" font-size="12.5" fill="#0550ae">Output dataset</text>

  <!-- PLC -->
  <rect x="560" y="104" width="330" height="196" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M560,146 V116 a12,12 0 0 1 12,-12 H878 a12,12 0 0 1 12,12 V146 Z" fill="#cf222e"/>
  <text x="725" y="133" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">PLC</text>
  <text x="725" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">WebSocket server (RFC 6455)</text>
  <text x="725" y="214" text-anchor="middle" font-size="12.5" fill="#57606a">+ your control logic</text>
  <rect x="596" y="244" width="120" height="32" rx="16" fill="#ffebe9" stroke="#ff8182"/>
  <text x="656" y="265" text-anchor="middle" font-size="12.5" fill="#a40e26">CODESYS</text>
  <rect x="730" y="244" width="132" height="32" rx="16" fill="#ffebe9" stroke="#ff8182"/>
  <text x="796" y="265" text-anchor="middle" font-size="12.5" fill="#a40e26">S7-1500 / TIA</text>

  <!-- link -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
  </defs>
  <line x1="406" y1="168" x2="552" y2="168" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="554" y1="232" x2="408" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="480" y="158" text-anchor="middle" font-size="11.5" fill="#57606a">binary image</text>
  <text x="480" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">WebSocket</text>
  <text x="480" y="248" text-anchor="middle" font-size="11.5" fill="#57606a">~10 ms cycle</text>

  <!-- bottom strip -->
  <rect x="70" y="330" width="820" height="52" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="480" y="362" text-anchor="middle" font-size="14" fill="#0550ae">Pick two datasets  &#8594;  generate the file  &#8594;  drop it into your IDE project  &#8594;  it runs.</text>
</svg>
